<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>OG Image SwissSimple (bilingue)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #333; display: flex; justify-content: center; padding: 0; }
  .og-image {
    width: 1200px; height: 630px;
    background: #0B0F19;
    position: relative; overflow: hidden;
    font-family: -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    color: #F8FAFC;
    display: flex; flex-direction: column; justify-content: center;
    padding: 80px 90px;
  }
  .glow {
    position: absolute; top: -200px; right: -150px;
    width: 700px; height: 700px; border-radius: 50%;
    background: radial-gradient(circle, rgba(59,130,246,0.18) 0%, rgba(11,15,25,0) 70%);
  }
  .brand { display: flex; align-items: center; gap: 22px; margin-bottom: 40px; }
  .swiss-cross {
    width: 64px; height: 64px; background: #C8102E; border-radius: 8px;
    position: relative; flex-shrink: 0;
  }
  .swiss-cross::before, .swiss-cross::after { content: ''; position: absolute; background: #fff; }
  .swiss-cross::before { width: 12px; height: 40px; left: 26px; top: 12px; }
  .swiss-cross::after  { width: 40px; height: 12px; left: 12px; top: 26px; }
  .brand-name { font-size: 58px; font-weight: 800; letter-spacing: -0.02em; }

/* Les deux S du logo en rouge — même rouge que la croix suisse */
.s-red { color: #C8102E; }

  /* Les deux titres : STRICTEMENT le même style FR et DE */
  .headline {
    font-size: 38px; font-weight: 800; line-height: 1.2; letter-spacing: -0.02em;
    color: #F8FAFC;
    margin-bottom: 12px;
  }
  .headline-de { margin-bottom: 48px; }
  .gradient {
    background: linear-gradient(90deg, #E11D48, #A78BFA);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .badges { display: flex; gap: 14px; }
  .badge {
    padding: 10px 18px; border-radius: 999px; font-size: 19px; font-weight: 700;
    background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.14); color: #E2E8F0;
    white-space: nowrap;
  }
  .url { position: absolute; bottom: 44px; right: 90px; font-size: 26px; font-weight: 700; color: #94A3B8; }
</style>
</head>
<body>
  <div class="og-image">
    <div class="glow"></div>
    <div class="brand">
      <div class="swiss-cross"></div>
      <div class="brand-name"><span class="s-red">S</span>wiss<span class="s-red">S</span>imple</div>
    </div>
    <div class="headline">Impôts, LAMal et retraite — <span class="gradient">simulés en 2 minutes.</span></div>
    <div class="headline headline-de">Steuern, KVG und Rente — <span class="gradient">in 2 Minuten simuliert.</span></div>
    <div class="badges">
      <div class="badge">✓ 100% gratuit · gratis</div>
      <div class="badge">✓ Données officielles · Offizielle Daten</div>
      <div class="badge">✓ 26 cantons · Kantone</div>
    </div>
    <div class="url">swisssimple.ch</div>
  </div>
</body>
</html>
