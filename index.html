<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SwissSimple | Simulateur d'Impôts, LAMal et Retraite en Suisse</title>
<meta name="description" content="Calculez vos impôts entre communes, comparez les primes LAMal et simulez votre retraite (AVS/LPP) en Suisse. 100% gratuit, précis et anonyme." />
<meta name="keywords" content="simulateur impôt suisse, comparateur assurance maladie, lamal, calcul avs, lpp, déménagement suisse, optimisation fiscale" />
<meta name="author" content="SwissSimple" />
<meta property="og:title" content="SwissSimple | Simulateurs Financiers Suisses" />
<meta property="og:description" content="La suite d'outils gratuite pour comparer vos impôts, optimiser votre assurance maladie et anticiper votre retraite." />
<meta property="og:type" content="website" />
<meta property="og:locale" content="fr_CH" />
<meta property="og:locale:alternate" content="de_CH" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
  body { margin: 0; background-color: #ffffff; font-family: 'Inter', system-ui, sans-serif; }
  
  #initial-loader {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background-color: #ffffff;
    z-index: 9999;
    transition: opacity 0.4s ease;
  }

  .loader-box { text-align: center; width: 220px; }
  .loader-logo { width: 60px; margin-bottom: 25px; animation: pulse 1.5s infinite ease-in-out; }
  .progress-track { width: 100%; height: 4px; background-color: #e0e0e0; border-radius: 10px; overflow: hidden; }
  
  .progress-fill {
    height: 100%;
    width: 0%;
    background-color: #2563eb;
    border-radius: 10px;
    transition: width 0.3s ease; /* Transition douce pour le JS */
  }

  .loader-text { margin-top: 15px; font-size: 13px; color: #666; letter-spacing: 0.5px; }

  @keyframes pulse {
    0%, 100% { opacity: 0.7; transform: scale(0.95); }
    50% { opacity: 1; transform: scale(1.05); }
  }
</style>
</head>
<body>

<div id="root">
  <div id="initial-loader">
    <div class="loader-box">
      <img src="/favicon.svg" alt="SwissSimple" class="loader-logo" />
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p class="loader-text">Chargement de SwissSimple...</p>
    </div>
  </div>
</div>

<!-- Script pour faire avancer la barre jusqu'à 90% en attendant React -->
<script>
  var progress = 0;
  var fill = document.getElementById('progress-fill');
  window.swissLoadingInterval = setInterval(function() {
    if (progress < 90) {
      progress += Math.random() * 15;
      if (progress > 90) progress = 90;
      fill.style.width = progress + '%';
    }
  }, 200);
</script>

<script type="module" src="/src/main.tsx"></script>
</body>
</html>
